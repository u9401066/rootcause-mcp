# ============================================================================
# 麻醉科專屬：圍術期心跳停止與重症事件 (M&M / RCA) 4-Tier 倒推因果分析規範
# Anesthesiology Perioperative Mortality & Morbidity (M&M) Root Cause Protocol
# ============================================================================
# 目的：
# 避免死亡/危急案例檢討僅停留在「終末心臟衰竭/心跳停止 (Terminal Arrest)」表面，
# 強制 AI Agent 依照麻醉專科思維，進行 4 層結構化「向後逆推 (Backward Reasoning)」：
# Tier 0 (終末事件) -> Tier 1 (5H5T 可逆機轉) -> Tier 2 (術中誘發觸發點) -> Tier 3 (系統與潛在根因)
# ============================================================================

version: "2.0.0"
protocol_name: "Anesthesia Perioperative M&M 4-Tier Backward Causal Protocol"
specialty: "Anesthesiology, Perioperative Medicine & Critical Care"
last_updated: "2026-08-14"
status: "non_normative_retrospective_framework"
safety_contract:
  - "This catalog supplies review cells, not patient facts, diagnoses, omissions, or causal conclusions."
  - "Each cell requires case-specific evidence, an explicit unknown, or a planned retrospective discriminator."
  - "Do not infer absence from missing documentation or emit active-care treatment instructions."

# ----------------------------------------------------------------------------
# 1. 四層倒推因果階層 (4-Tier Backward Reasoning Framework)
# ----------------------------------------------------------------------------
tiers:
  - tier: 0
    name: "Tier 0: 終末心肺衰竭事件 (Terminal Arrest / Shock)"
    focus: "記錄最後心跳停止的初始心律與致命表現"
    rhythms_to_identify:
      - "PEA (Pulseless Electrical Activity) - 最常見於 5H5T 機轉"
      - "Asystole (心搏停止) - 嚴重心肌缺氧、嚴重高血鉀、迷走神經反射"
      - "VF / Pulseless VT (心室顫動/無脈搏心室頻脈) - 缺血、電解質、長 QT、藥物毒性"
      - "Refractory Vasoplegic / Cardiogenic Collapse (頑固性血管麻痺/心因性休克)"

  - tier: 1
    name: "Tier 1: ACLS 5H5T 急性可逆生理機轉 (Acute Reversible Mechanisms)"
    focus: "系統性檢視每個 5H5T cell；只有來源充分的反證才能 disposition，missing data 必須標 unknown"
    five_h:
      - code: "H1_Hypovolemia"
        name: "低血容 (Hypovolemia)"
        clinical_clues: "出血、禁食過久、SVV > 15%、CVP 低、心臟超音波 LV 塌陷/Kissing walls"
      - code: "H2_Hypoxia"
        name: "缺氧 (Hypoxia)"
        clinical_clues: "ETT 脫落、單肺插管、氣道阻塞、支氣管痙攣、氣胸、通氣機斷線"
      - code: "H3_Hydrogen_Acidosis"
        name: "酸中毒 (Hydrogen Ion / Acidosis)"
        clinical_clues: "嚴重乳酸中毒、低灌流、PRIS 粒線體解偶聯、DKA、重度高碳酸血症"
      - code: "H4_Hypo_Hyperkalemia"
        name: "低鉀/高鉀血症 (Hypo/Hyperkalemia)"
        clinical_clues: "創傷/擠壓傷、庫血大量輸注、Succinylcholine 誘發高血鉀、ECG 尖銳 T 波/QRS 變寬"
      - code: "H5_Hypothermia"
        name: "低體溫 (Hypothermia)"
        clinical_clues: "核心體溫 < 35°C、大手術暴露、冷輸液、凝血功能惡化"
    five_t:
      - code: "T1_Tension_Pneumothorax"
        name: "張力性氣胸 (Tension Pneumothorax)"
        clinical_clues: "CVC 置放後、胸腔/腹腔鏡手術、氣道尖峰壓 (PIP) 驟升、單側呼吸音消失、氣管偏移"
      - code: "T2_Tamponade_Cardiac"
        name: "心包膜填塞 (Cardiac Tamponade)"
        clinical_clues: "心包積液、Beck's triad (低血壓、頸靜脈怒張、心音遙遠)、TEE RV 舒張期塌陷"
      - code: "T3_Toxins_Drugs"
        name: "毒素/藥物反應 (Toxins / Anesthetic Drugs)"
        clinical_clues: "LAST 局部麻醉藥毒性、過敏性休克 (Anaphylaxis)、PRIS、Inotrope 反常惡化 (SAM)、Syringe Swap"
      - code: "T4_Thrombosis_Pulmonary"
        name: "肺栓塞 / 骨水泥栓塞 (Pulmonary / Air / Fat / Cement Embolism)"
        clinical_clues: "骨科關節置換 BCIS、TEE RV 擴大 + D-sign、EtCO2 驟降、頑固性低血氧"
      - code: "T5_Thrombosis_Coronary"
        name: "冠狀動脈血栓 / 心肌梗塞 (Coronary Thrombosis / Perioperative MI)"
        clinical_clues: "術中 ST 節段上升/下降、TEE 局部心室壁運動異常 (RWMA)、心肌酵素升高"

  - tier: 2
    name: "Tier 2: 術中觸發點與三方交互作用 (Intraoperative Trigger Streams)"
    focus: "平行檢視 patient、procedure 與 anesthesia streams 的時間關聯和可替代解釋，不預設任一 stream 為 trigger"
    streams:
      patient_stream:
        name: "A. Patient Baseline & Pre-op Information"
        sub_categories:
          - "Documented or unknown structural/functional cardiac substrate"
          - "Documented or unknown rhythm/electrophysiology history"
          - "Airway assessment, limitations, and interval change"
          - "Medication/exposure reconciliation and uncertainty"
          - "Baseline physiology, frailty, organ function, and source conflicts"
      surgical_stream:
        name: "B. Procedure and Mechanical Event Stream"
        sub_categories:
          - "Bleeding/volume, embolic, pressure, traction, positioning, and device-related possibilities"
          - "Procedure-event timing and direct observations"
          - "Alternative non-procedural explanations and missing measurements"
      anesthesia_stream:
        name: "C. Anesthesia, Pharmacology, Airway, and Ventilation Stream"
        sub_categories:
          - "Drug identity, concentration, dose record, timing, expected effects, and reconciliation limits"
          - "Airway/device position, ventilation, gas exchange, and monitoring quality"
          - "Neuraxial/regional block extent and documented physiology"
          - "Hemodynamic intervention timing with non-specific response"
          - "Competing patient/procedure mechanisms and unknown data"

  - tier: 3
    name: "Tier 3: 潛在系統性漏洞與組織根因 (Latent System Factors & HFACS-MES)"
    focus: "檢討為何防護網沒有攔截到危險（人機界面、溝通、指引、疲勞）"
    hfacs_alignment:
      - level: "UA (Unsafe Acts)"
        examples: "Decision, perception, execution, or documentation factors only when supported by source-linked review"
      - level: "PC (Preconditions for Unsafe Acts)"
        examples: "Communication, workload, interface, environment, or team factors requiring case-specific evidence"
      - level: "US (Unsafe Supervision)"
        examples: "Supervision, escalation, staffing, or competency-system factors requiring case-specific evidence"
      - level: "OI / EF (Organizational & Environmental Factors)"
        examples: "Policy, equipment, training, governance, and organizational factors requiring case-specific evidence"

# ----------------------------------------------------------------------------
# 2. 麻醉 M&M 倒推分析執行規則 (Execution Constraints for Agents)
# ----------------------------------------------------------------------------
rules:
  - id: "RULE_MANDATORY_5H5T_CHECK"
    description: "對每個 5H5T cell記錄 candidate、reviewed no plausible candidate、insufficient data或 not assessed；不得以三項作為展開上限。"
  - id: "RULE_TRI_STREAM_INVESTIGATION"
    description: "禁止將責任單一歸咎於單一方面，必須同時橫向檢視 (A)病人基線 (B)外科手術 (C)麻醉處置 三大維度。"
  - id: "RULE_PARADOXICAL_REACTION_AUDIT"
    description: "若任何 intervention 後出現時間相鄰的反常變化，擴展相關 hemodynamic、drug/toxin、mechanical、measurement 與 baseline mechanisms；response本身不證明 SAM、LAST或因果。"
