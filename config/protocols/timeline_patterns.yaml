# ============================================================================
# 臨床時序圖推演模式庫 (Clinical Timeline Patterns Catalog)
# ============================================================================
# 提供 AI Agent 根據臨床案例類型選擇最佳的時序分期與演變模式，
# 支援時序圖 (Mermaid Timeline) 與時序表格的結構化聚類生成。
# ============================================================================

version: "2.0.0"
catalog_name: "Standard Clinical Timeline Patterns"
last_updated: "2026-08-18"
safety_contract:
  - "Patterns classify source-linked events; they do not infer missing events, diagnoses, errors, or causal links."
  - "Keywords are generic routing hints only. Preserve raw time, precision, timezone provenance, conflicts, and unknown time."
  - "Never copy example events, exact times, or clinical conclusions into a case ledger."

patterns:

  # 1. 圍術期標準分期模式 (Perioperative Sequence)
  perioperative_sequence:
    name: "圍術期標準分期模式 (Perioperative Sequence)"
    description: "適用於麻醉、手術室、恢復室 (PACU) 內的急性生理波動與事件"
    phases:
      - id: "p1"
        name: "1. Baseline & Pre-Op"
        description: "術前評估、基線生命徵象、病史與用藥調查"
        keywords: ["pre-op", "baseline", "admission", "assessment", "pre_anesthesia"]
      - id: "p2"
        name: "2. Induction & Surgical Events"
        description: "已記錄的麻醉、氣道、擺位、手術或處置事件"
        keywords: ["induction", "airway", "positioning", "procedure", "incision"]
      - id: "p3"
        name: "3. Crisis Progression & Deterioration"
        description: "已記錄的生理變化、警報或惡化；不由關鍵字推定機轉"
        keywords: ["deterioration", "vital-sign change", "alarm", "instability"]
      - id: "p4"
        name: "4. Diagnostic Findings & Rule-Outs"
        description: "檢查、影像、波形、實驗室結果及其限制；negative result 不自動等於排除"
        keywords: ["imaging", "ultrasound", "waveform", "laboratory", "diagnostic result"]
      - id: "p5"
        name: "5. Critical Collapse & Resuscitation"
        description: "來源明載的重大事件、復甦階段與轉歸"
        keywords: ["code", "arrest", "resuscitation", "return of circulation", "outcome"]

  # 2. 急性重症搶救模式 (Acute Crisis)
  acute_crisis:
    name: "急性重症搶救模式 (Acute Crisis & Resuscitation)"
    description: "適用於急診、加護病房 (ICU)、創傷搶救與嚴重休克進展"
    phases:
      - id: "c1"
        name: "1. Pre-Event Baseline"
        description: "事發前初始狀態、既往病史"
        keywords: ["baseline", "pre-event", "admitted", "history"]
      - id: "c2"
        name: "2. Precipitating Trigger"
        description: "事件前已記錄的 exposure、procedure 或環境改變；僅表示時間相鄰"
        keywords: ["exposure", "procedure", "infusion", "transfusion", "device change"]
      - id: "c3"
        name: "3. Acute Deterioration"
        description: "生命徵象惡化、乳酸飆升、呼吸急促、意識改變"
        keywords: ["worsening", "physiologic change", "symptom change", "laboratory change"]
      - id: "c4"
        name: "4. Crisis Recognition & Alarm"
        description: "生理監視器警報、檢驗通報或臨床辨識；保留原始解讀與後續裁決"
        keywords: ["alarm", "alert", "critical result", "recognition", "escalation"]
      - id: "c5"
        name: "5. Rescue & Resuscitation"
        description: "來源明載的重大事件應變與復甦紀錄"
        keywords: ["code", "resuscitation", "procedure", "support", "transfer"]
      - id: "c6"
        name: "6. Stabilization / Post-Crisis Outcome"
        description: "已記錄的穩定、轉院、後續照護、檢討或轉歸"
        keywords: ["stabilization", "follow-up", "outcome", "transferred", "review"]

  # 3. 延遲診斷與演變模式 (Delayed Diagnosis)
  delayed_diagnosis:
    name: "延遲診斷與隱匿演變模式 (Delayed Diagnosis & Latent Evolution)"
    description: "適用於門診/急診漏看報告、未追蹤異常檢驗值、病灶隱匿進展"
    phases:
      - id: "d1"
        name: "1. Initial Contact & Testing Order"
        description: "病人初次就診、開立影像或病理檢驗醫囑"
        keywords: ["clinic", "initial visit", "test ordered", "visit"]
      - id: "d2"
        name: "2. Diagnostic Test & Result Generation"
        description: "檢驗執行完成、影像或病理產出危急異常報告"
        keywords: ["test completed", "report generated", "result", "notification class"]
      - id: "d3"
        name: "3. Communication Gap & Missed Opportunity"
        description: "待核對的 routing、receipt、acknowledgment、ownership 或 follow-up interval；不得預設失敗"
        keywords: ["routing", "receipt", "acknowledgment", "follow-up", "escalation"]
      - id: "d4"
        name: "4. Latent Disease Progression"
        description: "結果與後續接觸之間的 interval、臨床演變及資料空白"
        keywords: ["interval", "progression", "no documented contact", "unknown"]
      - id: "d5"
        name: "5. Symptom Flare & Crisis Discovery"
        description: "後續症狀、再就醫或重新辨識事件"
        keywords: ["return visit", "triage", "symptom change", "rediscovery"]
      - id: "d6"
        name: "6. Late Diagnosis & Corrective Action"
        description: "後續診斷、處置、揭露、病安檢討或系統追蹤（若來源有記載）"
        keywords: ["diagnosis", "follow-up", "review", "disclosure", "quality report"]

  # 4. 瑞士乳酪防線失效模式 (Barrier Failure)
  barrier_failure:
    name: "瑞士乳酪防護失效模式 (Swiss Cheese Barrier Failure)"
    description: "適用於給藥錯誤、醫囑過期未續開、跨單位交接漏失等系統防線失靈"
    phases:
      - id: "b1"
        name: "1. Prescribing & Ordering Phase"
        description: "醫囑建立、修改、暫停與到期紀錄"
        keywords: ["order written", "order modified", "hold", "expiry"]
      - id: "b2"
        name: "2. Dispensing & Pharmacy Barrier"
        description: "藥局端之覆核、醫囑過期系統判定"
        keywords: ["pharmacy", "dispensing", "verification", "order status"]
      - id: "b3"
        name: "3. Administration & Nursing Barrier"
        description: "給藥、未給、延遲或例外紀錄；不由資料空白推定 omission"
        keywords: ["medication administration", "not given", "exception", "handoff"]
      - id: "b4"
        name: "4. Monitoring & Detection Barrier"
        description: "監測、症狀、異常結果及其已記錄的解讀；不得預設解讀錯誤"
        keywords: ["monitoring", "symptom", "abnormal result", "progress note"]
      - id: "b5"
        name: "5. Interception or Adverse Outcome"
        description: "防線全數穿透，終端重大危害或成功攔截"
        keywords: ["adverse event", "harm", "intercepted", "escalation", "outcome"]

  # 5. 醫療器材與機械事件模式 (Device Incident)
  device_incident:
    name: "醫療器材與機械性危機模式 (Medical Device Incident)"
    description: "適用於 LVAD、ECMO、呼吸器、透析機、微量輸注幫浦之警報與機械故障"
    phases:
      - id: "m1"
        name: "1. Baseline Device Setting"
        description: "器材初始設定、基準流量、壓力、轉速 (RPM)"
        keywords: ["baseline", "device setting", "implant", "controller log"]
      - id: "m2"
        name: "2. Mechanical / Hemodynamic Disturbance"
        description: "已記錄的 mechanical、flow、pressure 或 physiologic change；不預設原因"
        keywords: ["flow change", "pressure change", "mechanical change", "physiologic change"]
      - id: "m3"
        name: "3. Controller Alarm & Warnings"
        description: "控制器、監視器或系統警報與相關觀察"
        keywords: ["alarm", "warning", "controller log", "device log"]
      - id: "m4"
        name: "4. Interpretation & Recorded Response"
        description: "當時解讀、決策與設備/臨床反應；後見之明裁決另列"
        keywords: ["interpretation", "device adjustment", "clinical response", "consultation"]
      - id: "m5"
        name: "5. Subsequent Response & Outcome"
        description: "後續處置、設備狀態與轉歸；不得由改善反推單一因果"
        keywords: ["subsequent response", "device status", "transfer", "outcome"]
