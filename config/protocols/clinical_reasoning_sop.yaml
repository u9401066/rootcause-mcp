# RootCause MCP clinical reasoning policy for host Agents.
#
# RootCause MCP persists and validates an evidence ledger. The host Agent performs
# clinical interpretation; a qualified clinician remains responsible for review.

version: "2.0.0a2"
protocol_name: "Evidence-grounded broad differential and medical RCA"
last_updated: "2026-08-18"

communication_contract:
  default_locale: "zh-TW"
  default_audience: "clinician"
  prose_language: "Traditional Chinese"
  medical_terminology: "English"
  certainty_display: "qualitative"
  rules:
    - "Use Traditional Chinese prose while retaining English medical terms and abbreviations."
    - "Do not present placeholder priors or uncited likelihood ratios as patient probabilities."
    - "Separate source observation, clinical inference, unknown, and causal claim."

claim_layers:
  observed: "Exact, source-linked observation."
  inferred: "Agent interpretation that names its reasoning basis."
  unknown: "Missing, conflicting, imprecise, or unverified information."
  causal_claim: "Conservative RCA claim subject to evidence and qualified-human review."

differential_breadth:
  objective: >-
    Seek the maximum clinically reasonable breadth without stopping at an arbitrary
    count and without producing an unprioritized rare-disease laundry list.
  framework_selection:
    - "Use 5H5T for cardiac arrest or peri-arrest physiology."
    - "Use VINDICATE or an equivalent etiologic framework for broad undifferentiated syndromes."
    - "Use anatomic and organ-system localization when it adds distinct mechanisms."
    - "Review medication, toxicologic, exposure, device, iatrogenic, and system contributors."
  candidate_qualifiers:
    - "Explains at least one observed feature or a distinct plausible mechanism."
    - "Is a must-not-miss condition whose delayed exclusion could cause material harm."
    - "Is supported by case context, exposure, intervention, device, or temporal relationship."
    - "Explains a discordant finding that the current leading diagnosis does not explain."
  stop_rule: >-
    Continue expansion until another candidate would add no distinct mechanism,
    safety risk, or discriminating test. Document the framework cells reviewed and
    the important empty or unknown cells.
  final_minimum_unique_diagnoses: 3
  final_minimum_non_unknown_mechanisms: 2
  required_per_active_candidate:
    - "English diagnosis label"
    - "mechanism_category and diagnostic_role"
    - "why this diagnosis is plausible"
    - "source-linked evidence for, against, and neutral/context-only evidence"
    - "case-specific unknowns and alternative explanations"
    - "typed DISCONFIRM, RULE_OUT, or DISCRIMINATE planned test when evidence is incomplete"
    - "qualitative certainty justified by the ledger"

stages:
  - stage_id: "EVIDENCE_COLLECTION"
    name: "Evidence collection and physical grounding"
    entry_tool: "rc_add_evidence"
    required_criteria:
      min_evidence_count: 2
      require_physical_verification: true
      require_verbatim_snippets: true
    guidance_prompts:
      - "Record atomic findings with exact snippets, source locations, hashes, and source time precision."
      - "Keep inaccessible binary or visually transcribed content UNVERIFIED until a trusted reviewer confirms it."

  - stage_id: "DIFFERENTIAL_EXPANSION"
    name: "Mechanism-complete differential expansion"
    entry_tool: "rc_propose_hypothesis"
    required_criteria:
      min_unique_hypotheses_count: 3
      min_non_unknown_mechanism_categories: 2
      require_applicable_must_not_miss: true
      require_breadth_stop_rationale: true
    guidance_prompts:
      - "Select a syndrome-appropriate framework, then expand across distinct mechanisms."
      - "For every active diagnosis, state why, for, against, unknowns, discriminating test, and certainty."

  - stage_id: "BAYESIAN_EVALUATION"
    name: "Evidence disposition and Bayesian updating"
    entry_tool: "rc_link_evidence_to_hypothesis"
    required_criteria:
      require_per_active_hypothesis_disposition: true
      require_leading_and_must_not_miss_disconfirmation: true
    guidance_prompts:
      - "Apply the direct LR only when justified; use LR=1.0 when quantitative effect is unknown."
      - "Context-only evidence may remain neutral and must not be forced into support or refutation."

  - stage_id: "COGNITIVE_AUDIT"
    name: "Unknowns, conflicts, and cognitive audit"
    entry_tools:
      - "rc_reflect"
      - "rc_challenge_assumption"
      - "rc_identify_gaps"
    required_criteria:
      require_uncertainty_declared: true
      require_bias_reviewed: true
    guidance_prompts:
      - "Name unresolved time, measurement, source, and interpretation uncertainty."
      - "Review anchoring, confirmation bias, premature closure, search satisficing, and diagnostic momentum."

  - stage_id: "SYSTEM_RCA"
    name: "Medical root-process and system RCA"
    entry_tools:
      - "rc_add_cause"
      - "rc_add_why"
      - "rc_validate_causation"
    guidance_prompts:
      - "Keep clinical DDx separate from contributory process or system causes."
      - "A causation audit checks submitted proof obligations; it does not prove clinical causality."

  - stage_id: "READY_FOR_SYNTHESIS"
    name: "Deterministic report synthesis"
    entry_tool: "rc_generate_contract_report"
    required_criteria:
      completeness_score_threshold: 0.90
      require_qualified_human_review: true
    guidance_prompts:
      - "Preview first with locale='zh-TW' and audience='clinician'."
      - "Finalize only after all hard conformance checks and authorized human review pass."

must_not_miss_examples:
  cardiac_arrest_or_shock:
    - "Hypovolemia / hemorrhage"
    - "Hypoxia / airway or ventilation failure"
    - "Hydrogen ion excess (acidosis)"
    - "Hypo-/hyperkalemia and other metabolic derangement"
    - "Hypothermia"
    - "Tension pneumothorax"
    - "Cardiac tamponade"
    - "Toxins / medication effect / local anesthetic systemic toxicity"
    - "Pulmonary thrombosis / coronary thrombosis"
  acute_altered_mental_status:
    - "Hypoglycemia and severe metabolic disturbance"
    - "Non-convulsive status epilepticus"
    - "Intracranial hemorrhage or acute ischemia"
    - "Central nervous system infection"
    - "Medication, toxin, hypercapnia, or hypoxia"

likelihood_ratio_policy:
  quantitatively_unknown_value: 1.0
  non_neutral_requires:
    - "citation or locally approved calibration source"
    - "case-applicable rationale"
  neutral_semantics: >-
    LR=1.0 records a qualitative association or context only. It is not genuine
    supporting or refuting evidence and cannot satisfy a disconfirmation gate.
  prohibited:
    - "inventing a numeric LR from words such as strong, moderate, or weak"
    - "displaying an arbitrary prior or posterior as an estimated patient probability"
