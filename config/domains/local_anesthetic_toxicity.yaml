# Clinical Domain Playbook: Local Anesthetic Systemic Toxicity (LAST) & Lipid Rescue
# 麻醉科專科知識庫：局部麻醉藥全身毒性與脂肪乳劑急救

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Regional Anesthesia, Acute Pain & Clinical Toxicology"
scenario: "Retrospective review of neurologic or cardiovascular deterioration with possible local-anesthetic exposure"

mechanism_to_review:
  candidate: "Systemic local-anesthetic toxicity affecting neuronal and myocardial ion-channel/energy function"
  exposure_contexts_requiring_confirmation:
    - "Thoracic Paravertebral Block (TPVB) / Erector Spinae Plane (ESP)"
    - "Transversus Abdominis Plane (TAP) / Rectus Sheath Block"
    - "Interscalene / Supraclavicular Brachial Plexus Block"
    - "High-volume surgical wound infiltration (LIA) / Tumescent anesthesia"

candidate_findings_requiring_confirmation:
  - marker: "Biphasic progression: Metallic taste, perioral numbness, tinnitus -> Seizures -> Cardiovascular collapse"
    modality: "Clinical Progression / Awake Patient"
    significance: "A possible but non-universal temporal phenotype; absence or sequence does not establish or exclude LAST"
  - marker: "Severe conduction delay: PR prolongation, wide QRS, ventricular tachycardia, refractory asystole/PEA"
    modality: "12-Lead ECG / Telemetry"
    significance: "Compatible with sodium-channel effects but non-specific; reconcile competing metabolic, ischemic, and drug causes"
  - marker: "Accidental intravascular injection or rapid systemic absorption during block"
    modality: "Procedural Record / Syringe Aspiration"
    significance: "Exposure route/timing may increase plausibility but requires source and dose/concentration reconciliation"

differential_questions:
  - diagnosis: "Epileptic Seizure / Alcohol Withdrawal"
    discriminator: "Compare exposure timing, seizure history/EEG, metabolic data, co-exposures, and conduction findings; timing alone is not diagnostic"
  - diagnosis: "Vasovagal Syncope"
    discriminator: "Compare prodrome, rhythm, perfusion, exposure record, trajectory, and non-specific intervention response"
  - diagnosis: "High Spinal / Total Spinal Anesthesia"
    discriminator: "Review block level, respiratory/neurologic findings, ECG trajectory, exposure details, and alternate explanations"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific management and lipid-emulsion doses are intentionally excluded
    from this retrospective DDx resource. Consult the current local LAST protocol.
