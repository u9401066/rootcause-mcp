# Clinical Domain Playbook: Cannot Intubate, Cannot Oxygenate (CICO) & Difficult Airway Crisis
# 麻醉科專科知識庫：不能插管不能通氣 (CICO) 危機與緊急外科氣道

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Anesthesiology, Airway Management & Resuscitation"
scenario: "Retrospective review of difficult airway, ventilation, or oxygenation deterioration"

mechanisms_to_review:
  candidate: "Loss of airway patency, ineffective ventilation, device-position problem, pulmonary mechanism, or gas-delivery failure"
  possible_contexts_requiring_confirmation:
    - "Unanticipated anatomical variations (Cormack-Lehane Grade 4, morbid obesity, retrognathia)"
    - "Multiple failed rigid laryngoscopy attempts causing progressive airway bleeding, edema, and false passages"
    - "Complete neuromuscular block without baseline mask ventilation verification"

candidate_findings_requiring_confirmation:
  - marker: "SpO2 rapidly falling (< 80%) with no chest rise on bag-valve-mask or supraglottic airway"
    modality: "Pulse Oximetry & Physical Inspection"
    significance: "Critical source observation requiring reconciliation with device position, capnography, airway exam, and local event record"
  - marker: "Flat-line EtCO2 trace with zero tidal volume return on ventilator"
    modality: "Capnography"
    significance: "May reflect absent/low exhaled CO2, but equipment, perfusion, position, and sampling explanations must be reviewed"
  - marker: "Severe bradycardia following hypoxia in adult or pediatric patient"
    modality: "ECG Monitor"
    significance: "Potential deterioration marker with multiple etiologies; it does not independently establish an airway mechanism"

differential_questions:
  - diagnosis: "Laryngospasm during Light Anesthesia"
    discriminator: "Review source-linked airway examination, capnography, laryngoscopy, timing, and recorded response; a medication response is non-specific and this resource does not prescribe a dose"
  - diagnosis: "Bronchospasm / Asthma Exacerbation"
    discriminator: "Compare inspiratory/expiratory flow, airway pressure, auscultation, capnography, tube/device position, and data quality; absent documentation remains unknown"
  - diagnosis: "Esophageal Intubation"
    discriminator: "Review sustained capnography, ventilation, device depth/position evidence, and visualization quality; no single undocumented sign is treated as exclusion"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific airway management steps and doses are intentionally excluded
    from this retrospective DDx resource. Consult the current local difficult-airway
    and CICO protocol.
