# Clinical Domain Playbook: Pediatric Opioid Safety & Respiratory Depression
# Clinicians can customize monitoring criteria and pharmacogenomic rules here.

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Pediatric Anesthesiology & Pharmacogenomics"
scenario: "Retrospective review of pediatric postoperative respiratory deterioration"

mechanisms_to_review:
  candidates:
    - "Opioid exposure, pharmacokinetic/pharmacogenomic variability, and drug interaction"
    - "Upper-airway obstruction, sleep-disordered breathing, edema, bleeding, pulmonary, neurologic, or monitoring factors"

candidate_findings_requiring_confirmation:
  - marker: "Severe Bradypnea / Apnea during unmonitored sleep"
    modality: "Capnography / Pulse Oximetry"
    significance: "Compatible with opioid effect but non-specific; reconcile airway, pulmonary, neurologic, dose/timing, and monitoring evidence"
  - marker: "CYP2D6 *1xN / *2xN Gene Duplication"
    modality: "Pharmacogenomic Testing"
    significance: "May affect exposure interpretation; genotype alone does not establish the event mechanism"

differential_questions:
  - diagnosis: "Post-tonsillectomy Secondary Hemorrhage"
    discriminator: "Review bleeding examination, trend, airway findings, and record completeness; undocumented signs are unknown"
  - diagnosis: "Laryngospasm / Airway Obstruction"
    discriminator: "Review observed airway signs, capnography/oximetry, sleep state, device position, and documentation limitations"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific medication restrictions, monitoring, and reversal doses are
    intentionally excluded. Consult current pediatric and local protocols.
