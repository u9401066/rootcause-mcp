# Clinical Domain Playbook: LVAD Suction Event vs Pump Thrombosis
# 供臨床工程、心臟外科、麻醉科與加護病房使用之醫療器材危機鑑別手冊

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Mechanical Circulatory Support & Cardiac Intensive Care"
scenario: "HeartMate 3 / LVAD Low Flow Alarm, Power Spikes & Hemolysis"

mechanisms_to_review:
  candidates:
    - "Reduced LV preload with suction physiology"
    - "RV dysfunction or altered septal geometry"
    - "Pump thrombosis or other mechanical obstruction"
    - "Hypovolemia, inflow/outflow obstruction, rhythm, or measurement artifact"
  interpretation_guardrail: "PI, power, hemolysis, and echocardiography must be interpreted together with device model, trend, acquisition quality, and loading conditions; no listed combination is independently diagnostic"

candidate_findings_requiring_confirmation:
  - marker: "Pulsatility Index (PI) 驟降至 1.0"
    modality: "LVAD Controller Log"
    significance: "May be compatible with reduced pulsatility; review trend, signal quality, loading conditions, and competing device mechanisms"
  - marker: "Power 呈間歇性鋸齒狀突波 (Intermittent Power Spikes)"
    modality: "LVAD Power Log"
    significance: "Intermittency may help distinguish mechanisms but does not by itself exclude thrombosis or artifact"
  - marker: "Echocardiography: Small Collapsed LV + IVS Bowing INTO LV + Dilated RV"
    modality: "Bedside TTE / TEE"
    significance: "May support suction physiology when image quality, timing, septal position, and device data are concordant"
  - marker: "Cola-colored Urine & Elevated Plasma Free Hemoglobin / LDH"
    modality: "Laboratory"
    significance: "機械性紅血球剪切破裂溶血 (Mechanical Hemolysis)"

differential_questions:
  - diagnosis: "Pump Thrombosis (幫浦血栓)"
    discriminator: "Compare power/flow trends, hemolysis markers, imaging, ramp-study context, and device interrogation; preserve discordant or missing findings as unknown"
  - diagnosis: "Isolated Hypovolemia (單純低血容)"
    discriminator: "Compare RV/IVC/LV findings, ventilation, loading conditions, device trends, and image quality; recorded morphology is supportive rather than definitive"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific pump settings, medication, and procedural management are
    intentionally excluded. Consult the current device-specific and local LVAD protocol.
