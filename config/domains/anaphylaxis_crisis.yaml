# Clinical Domain Playbook: Perioperative Anaphylaxis & Vasoplegic Collapse
# 麻醉科專科知識庫：術中急性過敏性休克 vs 迷走神經反射 vs 血管麻痺鑑別

domain: "Anesthesiology & Clinical Immunology"
scenario: "Intraoperative Acute Cardiovascular Collapse, Bronchospasm, and Urticaria"

pathophysiology:
  primary_mechanism: "IgE-mediated mast cell degranulation releasing massive histamine, tryptase, leukotrienes, and prostaglandins"
  common_culprits:
    - "Neuromuscular Blocking Agents (NMBAs: Rocuronium, Suxamethonium, Atracurium)"
    - "Antibiotics (Cefazolin, Vancomycin, Penicillins)"
    - "Latex, Chlorhexidine, Colloids (Gelofusine, Voluven)"
    - "Blood products and reversal agents (Sugammadex, Protamine)"

pathognomonic_findings:
  - marker: "Sudden unexplained refractory hypotension accompanied by acute bronchospasm (High PIP > 40 cmH2O)"
    modality: "Ventilator & Hemodynamic Monitor"
    significance: "Combined severe vasodilation and airway resistance"
  - marker: "Erythema, urticaria, or facial/airway angioedema (often hidden under surgical drapes)"
    modality: "Physical Inspection under Drapes"
    significance: "Cutaneous hallmarks of systemic histamine release"
  - marker: "Serum Tryptase elevation (> 11.4 mcg/L or > 1.2 x baseline + 2)"
    modality: "Laboratory (Drawn at 1-2h post-event)"
    significance: "Confirms acute mast cell degranulation"

diagnostic_rules_to_rule_out:
  - diagnosis: "Dynamic LVOT Obstruction (SAM)"
    discriminator: "Anaphylaxis responds favorably to intravenous Epinephrine with improved BP, whereas SAM paradoxically collapses further"
  - diagnosis: "Massive Pulmonary Embolism (PE)"
    discriminator: "Anaphylaxis features severe airway resistance and responds to epinephrine; PE has normal lung compliance and dilated RV on TEE"
  - diagnosis: "Tension Pneumothorax"
    discriminator: "Bilateral wheezing without unilateral absent breath sounds or tracheal deviation"

treatment_protocol:
  strictly_contraindicated:
    - "Delaying Epinephrine administration (Epinephrine is the ONLY life-saving first-line drug)"
    - "Giving further doses of the suspected triggering agent or other NMBAs"
  recommended_rescue:
    - "STOP ALL POTENTIAL TRIGGERING AGENTS IMMEDIATELY"
    - "Call for immediate help and 100% FiO2"
    - "First-line Epinephrine IV bolus: Grade 2 (10-20 mcg), Grade 3 shock (50-100 mcg), Grade 4 arrest (1 mg ACLS)"
    - "Continuous Epinephrine infusion (0.05 - 0.2 mcg/kg/min)"
    - "Aggressive fluid resuscitation: 20-30 ml/kg crystalloids"
    - "Secondary therapies: H1/H2 blockers (Diphenhydramine 50mg + Famotidine 20mg), Hydrocortisone 200mg"
    - "Draw acute Serum Tryptase at 1h, 2h, and 24h baseline"
