# Clinical Domain Playbook: Perioperative Anaphylaxis & Vasoplegic Collapse
# 麻醉科專科知識庫：術中急性過敏性休克 vs 迷走神經反射 vs 血管麻痺鑑別

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Anesthesiology & Clinical Immunology"
scenario: "Intraoperative Acute Cardiovascular Collapse, Bronchospasm, and Urticaria"

mechanisms_to_review:
  candidate: "Mast-cell mediator release, including IgE- and non-IgE-mediated pathways"
  exposure_categories_requiring_source_confirmation:
    - "Neuromuscular Blocking Agents (NMBAs: Rocuronium, Suxamethonium, Atracurium)"
    - "Antibiotics (Cefazolin, Vancomycin, Penicillins)"
    - "Latex, Chlorhexidine, Colloids (Gelofusine, Voluven)"
    - "Blood products and reversal agents (Sugammadex, Protamine)"

candidate_findings_requiring_confirmation:
  - marker: "Sudden unexplained refractory hypotension accompanied by acute bronchospasm (High PIP > 40 cmH2O)"
    modality: "Ventilator & Hemodynamic Monitor"
    significance: "Combined severe vasodilation and airway resistance"
  - marker: "Erythema, urticaria, or facial/airway angioedema (often hidden under surgical drapes)"
    modality: "Physical Inspection under Drapes"
    significance: "Potentially supportive cutaneous finding; absence does not exclude the mechanism"
  - marker: "Serum Tryptase elevation (> 11.4 mcg/L or > 1.2 x baseline + 2)"
    modality: "Laboratory (Drawn at 1-2h post-event)"
    significance: "May support mast-cell activation when timing, paired baseline, assay, and clinical context are adequate; it is not independently confirmatory"

differential_questions:
  - diagnosis: "Dynamic LVOT Obstruction (SAM)"
    discriminator: "Compare source-linked airway/skin findings, echocardiography, exposure timing, and the non-specific hemodynamic response; medication response alone does not establish either diagnosis"
  - diagnosis: "Massive Pulmonary Embolism (PE)"
    discriminator: "Review airway pressures/compliance, RV findings, exposure timing, and imaging quality; no single response pattern excludes either candidate"
  - diagnosis: "Tension Pneumothorax"
    discriminator: "Review bilateral examination, airway pressures, imaging/ultrasound, and procedure timing; missing findings remain unknown"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific management and doses are intentionally excluded from this
    retrospective DDx resource. Consult the current local anaphylaxis protocol.
