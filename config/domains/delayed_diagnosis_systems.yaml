# Clinical Domain Playbook: Delayed Diagnosis & Closed-Loop Reporting Breakdown
# 供病安委員會、放射科、門診與急診檢討報告遺漏與延遲診斷使用之專科手冊

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings and system factors require case-specific source evidence."
  - "Do not pre-populate failures or actions without governance review and an accountable owner."
  - "This playbook does not establish negligence or clinical causality."

domain: "Diagnostic Safety & Clinical Informatics"
scenario: "Retrospective review of diagnostic-result follow-up and possible delay"

mechanism_domains_to_review:
  - "Result generation, routing, receipt, acknowledgment, escalation, and follow-up"
  - "Patient-facing notification and access barriers"
  - "Clinical interpretation, competing priorities, and diagnostic cognitive factors"
  - "Administrative workflow, interface, ownership, and audit-log limitations"
  - "A clinically reasonable interval or disease evolution without a preventable process failure"

candidate_findings_requiring_confirmation:
  - marker: "Critical Finding generated in HL7/RIS report but not acknowledged in EMR for > 7-30 days"
    modality: "RIS / EMR Audit Log"
    significance: "If source-linked and complete, may support a communication-loop gap; audit-log missingness is not proof of non-communication"
  - marker: "Paper/Fax report physical displacement (e.g. moved to archive box by non-clinical staff)"
    modality: "Physical Nursing Logbook / Administrative Memo"
    significance: "May identify a manual-process vulnerability only when the case-specific chain and ownership are verified"
  - marker: "Patient assumption of normalcy ('No news is good news')"
    modality: "Patient Interview / Triage Note"
    significance: "Interview evidence may identify a notification gap but requires reconciliation with communication records"

differential_questions:
  - diagnosis: "Normal Follow-up with Disease Recurrence"
    discriminator: "Compare original report wording, images/pathology, interval change, expected follow-up window, and reviewer interpretation"
  - diagnosis: "Intentional Patient Non-compliance"
    discriminator: "Reconcile patient account with call/message logs, access barriers, scheduling records, and documented shared decisions; do not presume blame"

candidate_system_actions_require_governance:
  constraints:
    - "Require source-linked failure evidence before proposing an action."
    - "Assign an accountable owner, due date, balancing measure, and approval state."
    - "Do not represent these examples as findings from the current case."
  examples:
    - "強制實施 EMR 電子危急值閉環回覆機制 (Critical Value Alerting with Mandatory Acknowledgment within 24h)"
    - "若開單醫師 48 小時內未開啟危急報告，自動派案給科部代理醫師或個案管理師 (Case Manager)"
    - "建立病患端雙向透明通知 App/簡訊，提醒病患『已有檢查報告完成，請預約回診』"
    - "取消紙本/傳真作為危急報告之主要交付管道"
