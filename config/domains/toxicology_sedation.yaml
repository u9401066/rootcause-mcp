# Clinical Domain Playbook: Propofol Infusion Syndrome (PRIS) & Critical Sedation
# Clinicians can customize diagnostic criteria and drug toxic thresholds here.

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Critical Care & Clinical Pharmacology"
scenario: "Refractory Metabolic Shock, AKI, and Rhabdomyolysis in Sedated ICU Patients"

mechanisms_to_review:
  candidate: "Drug/exposure-related mitochondrial and fatty-acid oxidation dysfunction"
  published_risk_context_to_verify: "High cumulative propofol exposure and critical-illness co-factors; threshold applicability requires a current cited source"

candidate_findings_requiring_confirmation:
  - marker: "Forest Green Urine"
    modality: "Urine Output Inspection"
    significance: "Excretion of green phenolic metabolites (quinol derivatives) of propofol"
  - marker: "Milky / Lipemic Serum"
    modality: "Blood Sampling / Lab Inspection"
    significance: "Impaired lipid clearance from 10% lipid emulsion vehicle"
  - marker: "Brugada-like ECG Pattern (coved ST elevation in V1-V3)"
    modality: "12-Lead ECG / Telemetry"
    significance: "Cardiac sodium/calcium channel blockade and severe myocardial failure"
  - marker: "Severe Unexplained High-Anion-Gap Lactic Acidosis with Refractory Bradycardia"
    modality: "ABG & Hemodynamics"
    significance: "Systemic mitochondrial collapse and metabolic failure"

differential_questions:
  - diagnosis: "Severe Septic Shock"
    discriminator: "Compare infection evidence, cultures, perfusion trajectory, exposure timing, and alternative explanations for urine/serum appearance; non-response or appearance alone does not exclude sepsis"
  - diagnosis: "Acute Alcoholic Pancreatitis"
    discriminator: "Review triglycerides, lipase trend, abdominal findings/imaging, nutrition, and drug exposure; avoid assigning the biochemical mechanism without source support"
  - diagnosis: "Seizure-Induced Rhabdomyolysis"
    discriminator: "Compare witnessed motor activity, EEG/monitoring limitations, CK trajectory, drug exposure, temperature, immobilization, and other muscle-injury mechanisms"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific sedation changes, investigations, and organ-support decisions are
    intentionally excluded. Consult current toxicology, ICU, and local protocols.
