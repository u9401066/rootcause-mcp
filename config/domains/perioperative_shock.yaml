# Clinical Domain Playbook: Perioperative Shock & Dynamic LVOT Obstruction (SAM)
# Clinicians can customize retrospective evidence questions here.

status: "non_normative_retrospective_differential_aid"
safety_contract:
  - "Candidate findings are prompts for source review, never pathognomonic conclusions."
  - "Do not emit patient-specific treatment, dose, contraindication, or rescue instructions."
  - "Use current local protocols and qualified-clinician judgment for active care."

domain: "Anesthesiology & Critical Care"
scenario: "Intraoperative Refractory Hypotensive Shock Post-Induction"

mechanisms_to_review:
  candidate: "Dynamic Left Ventricular Outflow Tract (LVOT) Obstruction with Systolic Anterior Motion (SAM)"
  possible_substrates_requiring_confirmation: "Septal hypertrophy, small hyperdynamic LV, or altered mitral-valve geometry"
  possible_contextual_factors:
    - "Reduced preload (propofol, blood loss, spinal/epidural block, lateral positioning)"
    - "Reduced afterload (propofol, volatile anesthetics)"
    - "Increased contractility / tachycardia (ephedrine, epinephrine, pain)"

candidate_findings_requiring_confirmation:
  - marker: "Dagger-shaped (late-peaking) CW Doppler across LVOT"
    modality: "TEE"
    significance: "May support dynamic obstruction when acquisition, alignment, loading conditions, and interpretation are adequate"
  - marker: "Bisferiens Pulse (Spike and Dome pattern)"
    modality: "Arterial Line Waveform"
    significance: "Rapid initial ejection followed by mid-systolic obstruction dip"
  - marker: "Eccentric Posterior Mitral Regurgitation Jet"
    modality: "TEE Color Doppler"
    significance: "SAM pulls anterior leaflet away from coaptation plane"
  - marker: "Paradoxical hemodynamic collapse after Inotropes (Epinephrine/Ephedrine)"
    modality: "Hemodynamic Monitor"
    significance: "A temporal association may be mechanism-consistent but is non-specific and cannot establish causality"

differential_questions:
  - diagnosis: "Massive Pulmonary Embolism (PE)"
    discriminator: "Review RV size/function, image quality, timing, and alternate embolic evidence; missing or non-diagnostic imaging does not exclude PE"
  - diagnosis: "Severe Anaphylaxis"
    discriminator: "Review exposure timing, airway/skin findings, tryptase context, and echocardiography; absence of a recorded feature or drug response is not exclusion"
  - diagnosis: "Isolated Hypovolemia"
    discriminator: "Compare source-linked volume assessment, bleeding, dynamic indices, echocardiography, and temporal responses; response alone is non-specific"
  - diagnosis: "Fixed Aortic Stenosis"
    discriminator: "Compare valve morphology and Doppler contour/quality with loading conditions documented at acquisition"

management_boundary:
  omitted: true
  reason: >-
    Patient-specific hemodynamic management and medication doses are intentionally
    excluded. Consult current echocardiography, anesthesia, and local crisis protocols.
