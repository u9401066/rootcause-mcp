[build-system]
# Pin the backend so isolated builds remain compatible with the Twine version
# used by release CI. Hatchling 1.32 emits Core Metadata 2.5, which Twine 6.2
# does not yet validate.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "rootcause-mcp"
version = "2.0.0a3"
description = "Evidence-grounded clinical reasoning ledger and conservative medical RCA MCP harness"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "RCA Team" }
]
keywords = ["mcp", "root-cause-analysis", "clinical", "fishbone", "5-why", "hfacs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # MCP Framework (SDK 2.0 - no 1.x compatibility)
    "mcp[cli]>=2.0.0",
    # Security floors for MCP/CLI transitive dependencies
    "click>=8.3.3",
    "cryptography>=50.0.0",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    # Data & Validation
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "jsonschema>=4.26.0",
    # Persistence
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    # Graph Analysis
    "networkx>=3.0",
    # Utilities
    "structlog>=24.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Phase 2: Advanced Analysis (Rule Engine based, no owlready2)
# Note: owlready2 was removed - using YAML rules + Agent classification instead
# See: memory-bank/decisionLog.md [2026-01-15] 移除 owlready2

# Phase 3: Causal Inference
causal = [
    # DoWhy 0.14 ships GCM in the base distribution and no longer declares a
    # separate `gcm` extra. Keeping the obsolete extra makes uv emit a warning.
    "dowhy>=0.14",
    "causal-learn>=0.1.3",
    "numpy>=1.26",
    "pandas>=2.0",
]

# Full installation
full = [
    "rootcause-mcp[causal]",
]

# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
]

[project.scripts]
rootcause-mcp = "rootcause_mcp.server_v2:main"

[project.urls]
Documentation = "https://u9401066.github.io/rootcause-mcp/"
Issues = "https://github.com/u9401066/rootcause-mcp/issues"
Source = "https://github.com/u9401066/rootcause-mcp"

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "rootcause_mcp/config"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.vscode",
    "/data",
    "/examples",
    "/.github/hooks/_state",
    "/docs/research/*.backup",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate commented-out code
    "PL",     # Pylint
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",     # Ruff formatter does not wrap long strings/docstrings
    "PLR0913",  # Too many arguments (RCA tools need many params)
    "PLR2004",  # Magic value comparison
    "PLC0415",  # Local imports intentionally avoid circular/optional dependencies
    "RUF001",   # Traditional Chinese punctuation is intentional
    "RUF002",   # Traditional Chinese punctuation in docstrings is intentional
    "RUF003",   # Traditional Chinese punctuation in comments is intentional
    "TC001",    # Runtime imports are retained for Pydantic/dataclass evaluation
    "TC003",    # Runtime standard-library types are retained for readability
]

[tool.ruff.lint.per-file-ignores]
"src/rootcause_mcp/application/guided_response.py" = ["PLR0911"]
"src/rootcause_mcp/domain/services/causation_validator.py" = ["PLR0912"]
"src/rootcause_mcp/domain/services/hfacs_suggester.py" = ["PLR0912", "PLR0915"]
"src/rootcause_mcp/domain/value_objects/hfacs.py" = ["ERA001"]
"src/rootcause_mcp/infrastructure/persistence/database.py" = ["PLW0603"]
"src/rootcause_mcp/interface/handlers/facade_handlers.py" = ["PLR0911", "PLR0912"]
"src/rootcause_mcp/interface/handlers/why_tree_handlers.py" = ["PLR0912", "PLR0915"]
"src/rootcause_mcp/interface/resources.py" = ["PLR0911", "PLR0912"]
"tests/**/*.py" = ["ERA001", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["rootcause_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src/rootcause_mcp",
    "--cov-report=term-missing",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/rootcause_mcp"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert used in tests

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260724",
    "vulture>=2.16",
]
